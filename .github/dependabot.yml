version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      tauri:
        patterns:
          - '@tauri-apps/*'
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react*'
    ignore:
      # typescript-eslint only supports TypeScript < 6.1, so 7.x breaks typed
      # linting. Remove once typescript-eslint declares TypeScript 7 support.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10

  # Workflows pin actions to commit SHAs; Dependabot bumps the SHA and the
  # version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - '*'
