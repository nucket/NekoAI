[advisories]
# Flag unmaintained crates only when we depend on them directly; the
# transitive ones (unic-*, proc-macro-error) come from Tauri/GTK and can only
# be fixed upstream.
unmaintained = "workspace"
ignore = []

[licenses]
# Permissive licenses compatible with shipping NekoAI under MIT. MPL-2.0 is
# file-level copyleft (cssparser/selectors via Tauri's HTML parser); we ship
# those crates unmodified, so it imposes no obligations on NekoAI's code.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.9

[bans]
# The Tauri/GTK/windows-rs stack pulls several majors of the same crate;
# report duplicates without failing the build.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
